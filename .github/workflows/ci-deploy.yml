name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT: social-pulse-510513
  REGION: asia-south1
  SERVICE: claimlens-api
  IMAGE: asia-south1-docker.pkg.dev/social-pulse-510513/claimlens/claimlens-api
  WIF_PROVIDER: projects/538594533263/locations/global/workloadIdentityPools/claimlens-github/providers/github-oidc
  DEPLOYER: claimlens-deployer@social-pulse-510513.iam.gserviceaccount.com
  RUNTIME_SA: claimlens-api@social-pulse-510513.iam.gserviceaccount.com
  BUCKET: social-pulse-510513-claimlens
  DOCAI_PROCESSOR: projects/social-pulse-510513/locations/us/processors/86b3907ea0dbb405
  TASKS_SA: claimlens-tasks@social-pulse-510513.iam.gserviceaccount.com
  SERVICE_URL: https://claimlens-api-538594533263.asia-south1.run.app

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run
      - run: npm run build

  deploy:
    name: Deploy to Cloud Run
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    permissions:
      contents: read
      id-token: write   # keyless auth to GCP (Workload Identity Federation)
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image (frontend + backend)
        run: |
          KEY=$(gcloud secrets versions access latest --secret claimlens-firebase-web-api-key --project "$PROJECT")
          echo "::add-mask::$KEY"
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          docker build --build-arg VITE_FIREBASE_API_KEY="$KEY" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:${GITHUB_SHA::7}"

      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE:${GITHUB_SHA::7}" --service-account "$RUNTIME_SA" \
            --cpu 1 --memory 1Gi --timeout 1800 --no-cpu-throttling --min-instances 0 --max-instances 2 \
            --set-env-vars "^##^APP_ENV=prod##STORAGE=gcs##DB=firestore##AI=vertex##OCR=docai##AUTH_MODE=firebase##GCP_PROJECT=${PROJECT}##BUCKET=${BUCKET}##FIRESTORE_DB=claimlens##GEMINI_MODEL=gemini-2.5-flash##VERTEX_LOCATION=global##DOCAI_LOCATION=us##DOCAI_PROCESSOR=${DOCAI_PROCESSOR}##JOBS=cloudtasks##TASKS_QUEUE=claimlens-jobs##TASKS_LOCATION=${REGION}##TASKS_SA=${TASKS_SA}##SERVICE_URL=${SERVICE_URL}##BILL_STORY=on"

      - name: Smoke check
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          curl -fsS "$URL/health"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/me")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/internal/jobs/run_case")" = 403
          curl -fsS "$URL/" | grep -q '<title>ClaimLens</title>'
          echo "Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
