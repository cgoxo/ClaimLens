[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claimlens"
version = "0.1.0"
description = "ClaimLens backend: insurance claim fraud investigator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pymupdf>=1.24",
  "rapidfuzz>=3.9",
  "python-dateutil>=2.9",
  "google-genai>=1.0",
  "google-cloud-storage>=2.17",
  "google-cloud-firestore>=2.16",
  "google-cloud-documentai>=2.29",
  "google-cloud-tasks>=2.16",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pillow>=10",
  "firebase-admin>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["claimlens"]

[tool.pytest.ini_options]
markers = ["live: hits real GCP"]
addopts = "-m 'not live'"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`", "ignore:builtin type swig:DeprecationWarning"]
