# gcloud builds submit forensics/catnet --config forensics/catnet/cloudbuild.yaml \
#   --substitutions _IMAGE=asia-south1-docker.pkg.dev/social-pulse-510513/claimlens/claimlens-forensics:<tag>,_WEIGHTS_SHA256=<sha>
steps:
  - id: weights
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        mkdir -p weights
        # the author's Google Drive copy refuses downloads ("only owner and editors"); this is a community copy
        # on Hugging Face (CC-BY 4.0 allows redistribution). Checked below, and loaded with weights_only=True.
        python - <<'PY'
        import urllib.request
        urllib.request.urlretrieve("https://huggingface.co/jtz18/CAT-NET/resolve/main/CAT_full_v2.pth.tar",
                                   "weights/CAT_full_v2.pth.tar")
        PY
        sha="$(sha256sum weights/CAT_full_v2.pth.tar | cut -d' ' -f1)"
        echo "CAT_full_v2.pth.tar sha256 $sha"
        if [ -n "${_WEIGHTS_SHA256}" ] && [ "$sha" != "${_WEIGHTS_SHA256}" ]; then echo "weights checksum mismatch" >&2; exit 1; fi
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]
  - id: test
    name: gcr.io/cloud-builders/docker
    args: ["run", "--rm", "--entrypoint", "python", "${_IMAGE}", "-m", "pytest", "-q", "/app/test_run_job.py"]
images: ["${_IMAGE}"]
substitutions:
  # pinned on the first successful fetch (2026-10-16): the build fails if the file ever changes
  _WEIGHTS_SHA256: "f82aaafdd1142775231feedcea0bb7027f7370561d9e8d107465454001865989"
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: "100"
timeout: 3600s
